<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>കൂത്തുപറമ്പ് രക്തസാക്ഷി അനുസ്മരണം - റിക്രൂട്ട്മെന്റ് ഫോം</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>കൂത്തുപറമ്പ് രക്തസാക്ഷി അനുസ്മരണം</h1>
      <h2>DYFI വളാഞ്ചേരി ബ്ലോക്ക് കമ്മിറ്റി</h2>
    </header>

    <form id="entryForm" class="card">
      <div class="field">
        <label for="committee">മേഖലാ കമ്മിറ്റി</label>
        <select id="committee" required>
          <option value="" disabled selected>തിരഞ്ഞെടുക്കുക</option>
        </select>
      </div>

      <div class="field">
        <label for="unitSelect">യൂണിറ്റിന്റെ പേര്</label>
        <select id="unitSelect" required disabled>
          <option value="" disabled selected>ആദ്യം മേഖല തിരഞ്ഞെടുക്കുക</option>
        </select>
        <input type="text" id="unitNew" class="hidden" autocomplete="off" placeholder="പുതിയ യൂണിറ്റിന്റെ പേര് നൽകുക">
      </div>

      <div class="field">
        <label for="name">പങ്കെടുക്കുന്നയാളുടെ പേര്</label>
        <input type="text" id="name" autocomplete="name" required>
      </div>

      <div class="field">
        <label>വയസ്സ്</label>
        <div class="radio-group">
          <label class="radio"><input type="radio" name="age" value="below" required> 40 ൽ താഴെ</label>
          <label class="radio"><input type="radio" name="age" value="above" required> 40 ന് മുകളിൽ</label>
        </div>
      </div>

      <div class="field">
        <label for="phone">ഫോൺ നമ്പർ</label>
        <input type="tel" id="phone" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="10 അക്ക നമ്പർ" required>
      </div>

      <button type="submit" id="submitBtn">SUBMIT</button>
      <div id="statusMsg" class="status"></div>
    </form>

    <div class="admin-link"><a href="admin.html">ADMIN LOGIN</a></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
